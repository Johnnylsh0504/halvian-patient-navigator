  font-family: "DM Sans", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--paper);
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: default;
  opacity: 0.53;
}
button,
a,
select,
input,
textarea {
  outline-offset: 4px;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid #c06932;
}
button {
  color: inherit;
}
h1,
h2,
h3,
p {
  margin: 0;
}
svg {
  flex-shrink: 0;
}
.wrap {
  width: min(1116px, calc(100% - 64px));
  margin: auto;
}
.mast {
  background: #fff;
  border-bottom: 1px solid var(--line);
}
.top,
.brand,
.mastactions,
.language,
.team-button,
.tabs,
.sectioncap,
.titleline,
.actions,
.choice-row,
.person,
.location,
.footer,
.footer > span,
.footer button,
.nextcard,
.textbtn,
.light,
.primary,
.verified,
.checkrow,
.choice,
.tickethead,
.reminders label,
.answerby,
.tag,
.worktabs,
.callout,
.send,
.iconbtn,
.symbol,
.avatar,
.mark,
.emergency,
.booking,
.sidequeue li > div {
  display: flex;
  align-items: center;
}
.top {
  min-height: 75px;
  justify-content: space-between;
  gap: 16px;
}
.brand {
  gap: 11px;
}
.mark {
  width: 43px;
  height: 43px;
  background: #135f54;
  color: white;
  border-radius: 13px;
  justify-content: center;
}
.brand strong,
.brand span {
  display: block;
}
.brand strong {
  font-size: 23px;
  letter-spacing: -1.2px;
  line-height: 1.12;
}
.brand span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
.mastactions {
  gap: 12px;
}
.language,
.team-button {
  gap: 7px;
  border: 1px solid var(--line);
  border-radius: 10px;
  min-height: 40px;
  padding: 0 11px;
  background: white;
  font-size: 14px;
  font-weight: 600;
}
.language select {
  border: 0;
  background: transparent;
  cursor: pointer;
  color: var(--ink);
  max-width: 105px;
}
.team-button {
  background: #edf4ef;
  color: var(--deep);
}
.team-button:hover,
.team-button.selected {
  background: #daebe0;
}
.navwrap {
  background: white;
  border-bottom: 1px solid var(--line);
}
.tabs {
  gap: 26px;
  min-height: 54px;
}
.tabs button {
  position: relative;
  background: none;
  border: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 15px 3px;
  font-size: 14px;
  white-space: nowrap;
  color: var(--muted);
  font-weight: 600;
}
.tabs button.active {
  color: var(--teal);
}
.tabs button.active:after {
  content: "";
  position: absolute;
  bottom: 0;
  height: 3px;
  left: 0;
  right: 0;
  border-radius: 3px;
  background: var(--teal);
}
.tabs button:hover {
  color: var(--teal);
}
.main {
  padding-top: 24px;
}
.hero {
  position: relative;
  isolation: isolate;
  background: #123f39;
  color: white;
  border-radius: 20px;
  overflow: hidden;
  padding: 31px 38px;
  min-height: 164px;
  display: flex;
  align-items: center;
}
.hero h1 {
  font-size: clamp(30px, 3.3vw, 47px);
  line-height: 1.1;
  letter-spacing: -1.8px;
  font-weight: 600;
  margin: 7px 0 8px;
}
.hero > div:first-child {
  max-width: 76%;
}
.eyebrow {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1.6px;
  color: var(--teal);
}
.hero .eyebrow {
  color: #b5e4c8;
}
.hero p {
  color: #e0eee4;
  font-size: 15px;
}
.hero-art {
  position: absolute;
  inset: 0 0 0 auto;
  width: 32%;
  z-index: -1;
  overflow: hidden;
  background-image: radial-gradient(#a2c7a52b 0.9px, transparent 0.9px);
  background-size: 11px 11px;
  mask-image: linear-gradient(to right, transparent, black 18%);
}
.orbit,
.stamp,
.dot {
  position: absolute;
}
.orbit {
  border: 1px solid #b9dda849;
  border-radius: 50%;
  top: 50%;
  left: 57%;
  transform: translate(-50%, -50%);
}
.o1 {
  width: 108px;
  height: 108px;
}
.o2 {
  width: 175px;
  height: 175px;
}
.o3 {
  width: 248px;
  height: 248px;
}
.stamp {
  width: 76px;
  height: 76px;
  background: #d6ed9f;
  color: #1a4e3c;
  border-radius: 23px;
  transform: translate(-50%, -50%) rotate(-7deg);
  left: 57%;
  top: 50%;
  display: grid;
  place-items: center;
  box-shadow: 0 5px 0 #0d352a44;
}
.stamp svg {
  transform: rotate(7deg);
}
.dot {
  background: #ecbb8c;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  left: calc(57% + 63px);
  top: 15%;
}
.d2 {
  background: #b0dbbd;
  left: calc(57% - 79px);
  top: 65%;
  width: 7px;
  height: 7px;
}
.tone-discharge .stamp {
  background: #f1cdae;
}
.tone-follow-up .stamp {
  background: #d7e7f2;
}
.tone-staff {
  background: #243f4e;
}
.layout {
  display: grid;
  grid-template-columns: minmax(0, 2.15fr) minmax(240px, 0.93fr);
  gap: 21px;
  align-items: start;
  margin-top: 22px;
}
.column,
.rail {
  display: grid;
  gap: 16px;
  min-width: 0;
}
.card,
.nextcard,
.worktabs {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.card {
  box-shadow: 0 2px 5px #193e2d05;
}
.pad,
.ask {
  padding: 25px 27px;
}
.sectioncap,
.titleline {
  gap: 11px;
}
.symbol,
.avatar {
  justify-content: center;
}
.symbol {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  color: #146454;
  background: #e4f2e8;
  flex-shrink: 0;
}
.symbol.peach {
  color: #7c4f34;
  background: #faebde;
}
.symbol.pale {
  background: #e5edf4;
  color: #3a6073;
}
.card h2 {
  font-size: 21px;
  line-height: 1.25;
  letter-spacing: -0.7px;
  font-weight: 700;
}
.card p {
  font-size: 14.5px;
  color: var(--muted);
}
.pad > .titleline + p,
.pad > .sectioncap + p,
.ask .intro {
  margin: 10px 0 15px;
}
.quickgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}
.quickgrid button {
  padding: 12px;
  min-height: 58px;
  display: flex;
  align-items: center;
  gap: 9px;
  text-align: left;
  color: var(--deep);
  background: #f5f8f3;
  border: 1px solid #dce7da;
  border-radius: 11px;
  font-size: 13px;
  line-height: 1.3;
  font-weight: 600;
}
.quickgrid button svg:last-child {
  margin-left: auto;
  color: #62756b;
}
.quickgrid button:hover,
.slot:hover,
.choice:hover,
.light:hover,
.nextcard:hover {
  background: #eaf2e9;
  border-color: #99bbab;
}
.composer {
  margin-top: 21px;
}
.fieldlabel,
.draftfields label span {
  display: block;
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 6px;
}
.inputrow {
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid #b8cbc2;
  border-radius: 12px;
  padding: 5px;
  background: white;
}
.inputrow:focus-within {
  border-color: var(--teal);
}
.inputrow input {
  border: 0;
  min-width: 20px;
  flex: 1;
  height: 36px;
  padding: 5px 8px;
  background: transparent;
}
.composer small,
.subnote,
small,
.small {
  font-size: 12px;
  color: var(--muted);
}
.subnote,
.inline-action small {
  display: block;
  margin-top: 8px;
}
.composer > small {
  display: block;
  margin-top: 7px;
}
.iconbtn,
.send {
  border: 0;
  background: none;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 9px;
}
.send {
  background: var(--teal);
  color: white;
}
.send:disabled {
  opacity: 0.56;
}
.voice-group {
  display: inline-flex;
  align-items: center;
}
.voice-group small {
  max-width: 140px;
  line-height: 1.15;
  font-size: 10.5px;
}
.nextcard {
  gap: 14px;
  text-align: left;
  width: 100%;
  padding: 16px 21px;
}
.nextcard > svg {
  margin-left: auto;
  color: var(--teal);
}
.nextcard strong,
.nextcard small,
.person strong,
.person small {
  display: block;
}
.nextcard strong {
  font-size: 16px;
}
.visit,
.sidequeue {
  padding: 21px;
}
.person {
  gap: 11px;
  margin: 13px 0 16px;
}
.avatar {
  background: #f3dfce;
  color: #70462e;
  font-size: 17px;
  font-weight: 700;
  width: 44px;
  height: 44px;
  border-radius: 50%;
}
.visitline,
.details {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.visitline {
  padding: 6px 0;
  font-size: 12px;
}
.visitline span,
.details span {
  color: var(--muted);
}
.visitline b {
  text-align: right;
  font-weight: 600;
}
.sidequeue .sectioncap {
  gap: 8px;
  color: var(--teal);
}
.sidequeue h2 {
  font-size: 17px;
  color: var(--ink);
}
.sidequeue > p,
.emergency p {
  font-size: 13px;
  line-height: 1.5;
}
.sidequeue > p {
  margin: 10px 0;
}
.emergency {
  align-items: flex-start;
  gap: 10px;
  background: #f4ebe1;
  border: 1px solid #e9d9c9;
  border-radius: 15px;
  padding: 16px 18px;
  color: #714829;
}
.emergency svg {
  margin-top: 2px;
}
.emergency strong {
  font-size: 14px;
}
.emergency p {
  margin-top: 4px;
  color: #684f3e;
}
.footer {
  justify-content: space-between;
  gap: 12px;
  padding: 18px 0 26px;
  margin-top: 16px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}
.footer > span,
.footer button {
  gap: 6px;
}
.footer button,
.textbtn {
  border: 0;
  background: none;
}
.textbtn,
.light,
.primary,
.choice,
.worktabs button,
.slot {
  font-size: 13px;
  font-weight: 600;
}
.textbtn,
.light,
.primary {
  gap: 6px;
}
.textbtn {
  color: var(--teal);
  padding: 6px 0;
}
.light,
.primary {
  min-height: 36px;
  border-radius: 9px;
  padding: 7px 12px;
}
.light {
  background: #fff;
  border: 1px solid var(--line);
}
.primary {
  color: white;
  background: var(--teal);
  border: 1px solid var(--teal);
}
.primary:hover:not(:disabled) {
  background: #134c45;
}
.actions,
.choice-row {
  flex-wrap: wrap;
  gap: 10px;
}
.actions > .textbtn {
  margin-left: 2px;
}
.conversation {
  display: grid;
  gap: 12px;
  margin-top: 16px;
  max-height: 365px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 1px 5px 1px 0;
  scrollbar-width: thin;
}
.turn {
  display: grid;
  gap: 7px;
}
.bubble.patient {
  justify-self: end;
  max-width: 84%;
  background: #e2eddf;
  padding: 8px 12px;
  border-radius: 12px 12px 3px 12px;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.answer {
  border: 1px solid #d8e6df;
  background: #f5f9f5;
  border-radius: 3px 12px 12px;
  padding: 12px 14px;
}
.answer.handoff {
  background: #fff6eb;
  border-color: #e9d5bb;
}
.answerby,
.verified {
  color: var(--teal);
  font-size: 12px;
  font-weight: 700;
  gap: 6px;
}
.answer p {
  margin: 6px 0 9px;
  color: var(--ink);
}
.answer.handoff .answerby {
  color: #805421;
}
.answer .light {
  min-height: 28px;
  padding: 3px 8px;
  font-size: 12px;
}
.tickets {
  padding: 0;
  margin: 10px 0;
  list-style: none;
}
.tickets li {
  padding: 8px 0;
  border-top: 1px solid var(--line);
  font-size: 13px;
}
.tickets li > div,
.tickethead {
  justify-content: space-between;
  gap: 6px;
}
.tickets li p,
.workticket p {
  overflow-wrap: anywhere;
}
.tag {
  display: inline-flex;
  color: var(--deep);
  background: #eaf2e6;
  border-radius: 100px;
  font-weight: 700;
  font-size: 10px;
  line-height: 1.25;
  padding: 4px 8px;
}
.tag.amber {
  color: #764414;
  background: #fae7c9;
}
.tag.green {
  color: #195e38;
  background: #e2efdd;
}
.details {
  padding: 12px 0;
  margin: 8px 0 14px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.pad .verified {
  font-size: 12px;
  color: var(--teal);
  margin: 12px 0;
}
.planrows {
  margin: 14px 0;
  display: grid;
}
.planrows > div {
  display: flex;
  align-items: start;
  gap: 12px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.planrows > div > svg {
  color: var(--teal);
  margin-top: 2px;
}
.planrows h3,
.booking strong {
  font-size: 15px;
}
.planrows p {
  margin-top: 3px;
}
.choice-row {
  margin: 12px 0;
}
.choice,
.slot {
  background: white;
  border: 1px solid #c6d6cf;
  border-radius: 10px;
  padding: 8px 11px;
}
.chosen,
.choice.chosen,
.slot.chosen {
  background: #e6f1e7;
  border: 2px solid var(--teal);
  padding: 7px 10px;
  color: var(--teal);
}
.callout {
  padding: 12px 14px;
  background: #edf4f5;
  color: #34565d;
  gap: 10px;
  border-radius: 11px;
  margin: 12px 0;
  font-size: 14px;
  align-items: flex-start;
}
.callout good,
.callout.good {
  background: #e4f2e4;
  color: #25593a;
}
.callout.warn {
  background: #fff0dc;
  color: #70481d;
}
.location {
  gap: 7px;
  flex-wrap: wrap;
  margin: 14px 0;
  color: var(--muted);
  font-size: 14px;
}
.location .tag {
  margin-left: auto;
}
.slotgrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 13px 0;
}
.slot {
  display: flex;
  align-items: start;
  flex-direction: column;
}
.slot span {
  font-size: 12px;
  color: var(--muted);
}
.slot b {
  font-size: 15px;
}
.booking {
  gap: 12px;
  color: var(--deep);
  background: #edf5ea;
  border-radius: 12px;
  padding: 13px;
  margin: 10px 0;
}
.booking p {
  margin-top: 1px;
}
.reminders {
  margin-top: 17px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.reminders label {
  gap: 7px;
  font-size: 13px;
  font-weight: 600;
}
.reminders select,
.workticket input,
.draftfields textarea {
  border: 1px solid #bacbc3;
  border-radius: 8px;
  background: #fff;
  padding: 7px 9px;
  color: var(--ink);
  font-size: 14px;
}
.reminders small {
  width: 100%;
}
.worktabs {
  display: flex;
  padding: 4px;
  gap: 4px;
  border-radius: 12px;
}
.worktabs button {
  flex: 1;
  border-radius: 8px;
  background: none;
  border: 0;
  padding: 8px;
  color: var(--muted);
}
.worktabs button.active {
  background: #dfeee3;
  color: var(--deep);
}
.source {
  margin: 12px 0;
  padding: 10px 12px;
  background: #f5f7f4;
  border-radius: 9px;
  font-size: 13px;
}
.source summary {
  cursor: pointer;
  font-weight: 600;
}
.source ul {
  margin: 7px 0 0;
  padding-left: 18px;
}
.draftfields {
  display: grid;
  gap: 8px;
}
.draftfields textarea {
  width: 100%;
  resize: vertical;
  min-height: 50px;
}
.checkrow {
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  margin: 13px 0;
}
.checkrow input {
  margin-top: 4px;
  accent-color: var(--teal);
  width: 17px;
  height: 17px;
}
.workticket {
  border-top: 1px solid var(--line);
  padding-top: 11px;
  margin-top: 13px;
}
.workticket form {
  margin: 7px 0;
}
.workticket input {
  width: 100%;
  margin-bottom: 7px;
}
.count {
  padding: 2px 8px;
  background: var(--mint);
  border-radius: 8px;
  font-size: 12px;
}
.pad table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin: 12px 0;
}
.pad caption {
  text-align: left;
  font-weight: 600;
  margin: 4px 0 6px;
}
.pad td,
.pad th {
  text-align: left;
  padding: 7px 8px;
  border-bottom: 1px solid var(--line);
}
.pad th {
  background: #edf4ef;
}
.footer button {
  color: var(--muted);
  font-size: 12px;
}
.sr-only,
.skip:not(:focus) {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
.skip:focus {
  position: absolute;
  z-index: 20;
  background: white;
  padding: 8px;
}
.status {
  color: var(--deep);
  margin-top: 8px;
}
.inline-action {
  display: inline-block;
}
.small {
  font-size: 12px !important;
}
.rating {
  margin-top: 16px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
  font-size: 12px;
  color: var(--muted);
}
.rating span,
.rating > div,
.rating button {
  display: flex;
  align-items: center;
  gap: 5px;
}
.rating > div {
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.rating button {
  border: 1px solid var(--line);
  background: white;
  border-radius: 7px;
  padding: 4px 8px;
  font-size: 12px;
}
.rating button.selected {
  background: var(--mint);
  color: var(--teal);
  border-color: var(--teal);
}
.reminder-preview {
  width: 100%;
  font-size: 13px !important;
  color: var(--ink) !important;
  background: #f3f6ee;
  padding: 8px 10px;
  border-radius: 8px;
}
@media (max-width: 840px) {
  .wrap {
    width: calc(100% - 32px);
  }
  .layout {
    grid-template-columns: minmax(0, 1.75fr) minmax(210px, 1fr);
    gap: 13px;
  }
  .pad,
  .ask,
  .visit,
  .sidequeue {
    padding: 17px;
  }
  .quickgrid {
    grid-template-columns: 1fr;
  }
  .quickgrid button {
    min-height: 41px;
  }
  .hero {
    min-height: 137px;
    padding: 23px;
  }
  .tabs {
    gap: 16px;
  }
}
@media (max-width: 670px) {
  .wrap {
    width: calc(100% - 24px);
  }
  .top {
    min-height: 62px;
  }
  .mastactions {
    gap: 5px;
  }
  .language,
  .team-button {
    padding: 0 6px;
    font-size: 12px;
    min-height: 37px;
  }
  .mark {
    width: 35px;
    height: 35px;
  }
  .brand {
    gap: 6px;
  }
  .brand strong {
    font-size: 18px;
  }
  .brand span {
    font-size: 9.5px;
  }
  .tabs {
    gap: 2px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    min-height: 42px;
  }
  .tabs button {
    white-space: normal;
    justify-content: center;
    font-size: 11.5px;
    gap: 4px;
    line-height: 1.15;
    height: 48px;
    padding: 4px;
  }
  .tabs button svg {
    width: 14px;
  }
  .main {
    padding-top: 12px;
  }
  .hero {
    border-radius: 15px;
    min-height: 124px;
    padding: 17px;
  }
  .hero h1 {
    font-size: 28px;
    letter-spacing: -1.1px;
  }
  .hero p {
    font-size: 12.5px;
  }
  .hero .eyebrow {
    font-size: 9px;
  }
  .hero-art {
    width: 27%;
  }
  .stamp {
    width: 47px;
    height: 47px;
    border-radius: 13px;
  }
  .stamp svg {
    width: 28px;
  }
  .o1 {
    width: 65px;
    height: 65px;
  }
  .o2 {
    width: 103px;
    height: 103px;
  }
  .o3 {
    width: 139px;
    height: 139px;
  }
  .dot {
    display: none;
  }
  .layout {
    grid-template-columns: 1fr;
    margin-top: 12px;
  }
  .column,
  .rail {
    gap: 10px;
  }
  .quickgrid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
  }
  .quickgrid button {
    font-size: 12px;
    padding: 8px;
    gap: 5px;
  }
  .quickgrid button svg:last-child {
    display: none;
  }
  .card h2 {
    font-size: 19px;
  }
  .pad,
  .ask {
    padding: 15px;
  }
  .footer {
    margin-top: 12px;
    align-items: flex-start;
  }
  .slotgrid {
    gap: 5px;
  }
  .reminders select {
    max-width: 100%;
  }
  .emergency {
    order: -1;
  }
  .sidequeue .textbtn {
    min-height: 36px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }
}
@media print {
  .mast,
  .navwrap,
  .hero,
  .rail,
  .footer,
  .nextcard,
  .skip,
  .worktabs,
  .actions,
  .reminders,
  .light,
  .primary,
  .card:not(.printable),
  .verified svg {
    display: none !important;
  }
  .wrap {
    width: 100%;
  }
  .layout,
  .column,
  .printable {
    display: block !important;
  }
  .printable {
    box-shadow: none;
    border: 0;
  }
  .main {
    padding: 0;
  }
  body {
    background: white;
  }
  .booking {
    border: 1px solid #333;
  }
}
