body {

button,
input,
select,
textarea {

button,
a,
select,
input,
textarea {

button:focus-visible,

button {

}
h1,

p {

svg {

.mast {

}
.top,
.brand,
.mastactions,
.language,
.team-button,
.tabs,
.sectioncap,
.titleline,
.actions,
.choice-row,
.person,
.location,
.footer,
.footer > span,
.footer button,
.nextcard,
.textbtn,
.light,
.primary,
.verified,
.checkrow,
.choice,
.tickethead,
.reminders label,
.answerby,
.tag,
.worktabs,
.callout,
.send,
.iconbtn,
.symbol,
.avatar,
.mark,
.emergency,
.booking,

.top {

}
.brand {

}
.mark {

}
.brand strong,
.brand span {

}
.brand strong {

}
.brand span {

}
.mastactions {
  gap: 12px;
}
.language,
.team-button {

  background: white;
  font-size: 14px;
  font-weight: 600;
}
.language select {

.language select:focus-visible {

}
.language:focus-within {

}
.team-button {

.team-button:hover,
.team-button.selected {

}
.navwrap {
  background: white;
  border-bottom: 1px solid var(--line);
}
.hospitalmast {
  background: #f8faf9;
}
.clinicalmark {
  background: #243f4e;
}
.hospitalnavwrap {
  background: #243f4e;
  border-bottom: 0;
}
.hospitaltabs {
  min-height: 54px;
  display: flex;
  align-items: stretch;
  gap: 5px;
  overflow-x: auto;
  scrollbar-width: thin;
}
.hospitaltabs a,
.hospitaltabs button {
  position: relative;
  min-width: 112px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 13px 11px;
  color: #dce8e5;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.hospitaltabs button {
  border: 0;
  background: transparent;
  font: inherit;
}
.hospitaltabs a:hover,
.hospitaltabs a.active,
.hospitaltabs button:hover,
.hospitaltabs button.active {
  color: white;
  background: #31534f;
}
.hospitaltabs a.active:after,
.hospitaltabs button.active:after {
  content: "";
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 0;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: #d6ed9f;
}
.tabs {
  gap: 26px;
  min-height: 54px;
  overflow-x: auto;
  scrollbar-width: thin;
}
.tabs button {
  position: relative;
  background: none;
  border: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 15px 3px;
  font-size: 14px;
  white-space: nowrap;
  color: var(--muted);
  font-weight: 600;
}
.tabs button.active {
  color: var(--teal);
}
.tabs button.active:after {
  content: "";
  position: absolute;
  bottom: 0;
  height: 3px;
  left: 0;
  right: 0;
  border-radius: 3px;
  background: var(--teal);
}
.tabs button:hover {
  color: var(--teal);
}
.tabs button:disabled {
  color: #94a29f;

}
.tabs button:disabled:hover {
  color: #94a29f;
}
.main {
  padding-top: 24px;
}
.hero {
  position: relative;
  isolation: isolate;
  background: #123f39;
  color: white;
  border-radius: 20px;
  overflow: hidden;
  padding: 31px 38px;
  min-height: 164px;
  display: flex;
  align-items: center;
}
.hero h1 {
  font-size: clamp(30px, 3.3vw, 47px);
  line-height: 1.1;
  letter-spacing: -1.8px;
  font-weight: 600;
  margin: 7px 0 8px;
}
.hero > div:first-child {
  max-width: 76%;
}
.eyebrow {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1.6px;
  color: var(--teal);
}
.hero .eyebrow {
  color: #b5e4c8;
}
.hero p {
  color: #e0eee4;
  font-size: 15px;
}
.hero-art {
  position: absolute;
  inset: 0 0 0 auto;
  width: 32%;
  z-index: -1;
  overflow: hidden;
  background-image: radial-gradient(#a2c7a52b 0.9px, transparent 0.9px);
  background-size: 11px 11px;
  mask-image: linear-gradient(to right, transparent, black 18%);
}
.orbit,
.stamp,
.dot {
  position: absolute;
}
.orbit {
  border: 1px solid #b9dda849;
  border-radius: 50%;
  top: 50%;
  left: 57%;
  transform: translate(-50%, -50%);
}
.o1 {
  width: 108px;
  height: 108px;
}
.o2 {
  width: 175px;
  height: 175px;
}
.o3 {
  width: 248px;
  height: 248px;
}
.stamp {
  width: 76px;
  height: 76px;
  background: #d6ed9f;
  color: #1a4e3c;
  border-radius: 23px;
  transform: translate(-50%, -50%) rotate(-7deg);
  left: 57%;
  top: 50%;
  display: grid;
  place-items: center;
  box-shadow: 0 5px 0 #0d352a44;
}
.stamp svg {
  transform: rotate(7deg);
}
.dot {
  background: #ecbb8c;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  left: calc(57% + 63px);
  top: 15%;
}
.d2 {
  background: #b0dbbd;
  left: calc(57% - 79px);
  top: 65%;
  width: 7px;
  height: 7px;
}
.tone-discharge .stamp {
  background: #f1cdae;
}
.tone-check-in .stamp {
  background: #dce9a6;
}
.tone-symptoms .stamp {
  background: #f0c7b1;
}
.tone-wait .stamp {
  background: #c5dfe2;
}
.tone-follow-up .stamp {
  background: #d7e7f2;
}
.tone-staff {
  background: #243f4e;
}
.layout {
  display: grid;
  grid-template-columns: minmax(0, 2.15fr) minmax(240px, 0.93fr);
  gap: 21px;
  align-items: start;
  margin-top: 22px;
}
.column,
.rail {
  display: grid;
  gap: 16px;
  min-width: 0;
}
.card,
.nextcard,
.worktabs {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.card {
  box-shadow: 0 2px 5px #193e2d05;
  min-width: 0;
}
.pad,
.ask {
  padding: 25px 27px;
}
.sectioncap,
.titleline {
  gap: 11px;
}
.symbol,
.avatar {
  justify-content: center;
}
.symbol {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  color: #146454;
  background: #e4f2e8;
  flex-shrink: 0;
}
.symbol.peach {
  color: #7c4f34;
  background: #faebde;
}
.symbol.pale {
  background: #e5edf4;
  color: #3a6073;
}
.card h2 {
  font-size: 21px;

}
.card p {

.pad > .titleline + p,

.quickgrid {

  background: #f5f8f3;

.quickgrid button:hover,
.slot:hover,
.choice:hover,
.light:hover,
.nextcard:hover {

}
.composer {
  margin-top: 21px;

}
.formgrid.inset {

  background: #f5f8f3;
}
.field {

}
.field > span,
.structured span,
.summarygrid dt {

.field input:not([type="range"]),
.field select,
.field textarea {

.field textarea {

.symptomtext {

.scanbox strong,

  clip-path: inset(50%);
}

.checkrow span > svg {

}

.statussteps {

.statussteps li {
  position: relative;

  font-size: 10.5px;
}
.statussteps li:before {
  content: "";
  position: absolute;

.statussteps li.done,
.statussteps li.current {

.statussteps li.current:before {

.inputrow {

.composer small,
.subnote,
small,
.small {

.subnote,
.inline-action small {

.composer > small {

.iconbtn,
.send {

.send {

.voice-group {

.visit,
.sidequeue {

.avatar {

.details {

.sidequeue > p {

.emergency svg {

.details {
  padding: 12px 0;
  margin: 8px 0 14px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.pad .verified {
  font-size: 12px;
  color: var(--teal);
  margin: 12px 0;
}
.planrows {
  margin: 14px 0;
  display: grid;
}
.planrows > div {
  display: flex;
  align-items: start;
  gap: 12px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.planrows > div > svg {
  color: var(--teal);
  margin-top: 2px;
}
.planrows h3,
.booking strong {
  font-size: 15px;
}
.planrows p {
  margin-top: 3px;
}
.choice-row {
  margin: 12px 0;
}
.choice,
.slot {
  background: white;
  border: 1px solid #c6d6cf;
  border-radius: 10px;
  padding: 8px 11px;
}
.chosen,
.choice.chosen,
.slot.chosen {
  background: #e6f1e7;
  border: 2px solid var(--teal);
  padding: 7px 10px;
  color: var(--teal);
}
.callout {
  padding: 12px 14px;
  background: #edf4f5;
  color: #34565d;
  gap: 10px;
  border-radius: 11px;
  margin: 12px 0;
  font-size: 14px;
  align-items: flex-start;
}
.callout good,
.callout.good {
  background: #e4f2e4;
  color: #25593a;
}
.callout.warn {
  background: #fff0dc;
  color: #70481d;
}
.location {
  gap: 7px;
  flex-wrap: wrap;
  margin: 14px 0;
  color: var(--muted);
  font-size: 14px;
}
.location .tag {
  margin-left: auto;
}
.slotgrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 13px 0;
}
.slot {
  display: flex;
  align-items: start;
  flex-direction: column;
}
.slot span {
  font-size: 12px;
  color: var(--muted);
}
.slot b {
  font-size: 15px;
}
.booking {
  gap: 12px;
  color: var(--deep);
  background: #edf5ea;
  border-radius: 12px;
  padding: 13px;
  margin: 10px 0;
}
.booking p {
  margin-top: 1px;
}
.reminders {
  margin-top: 17px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.reminders label {
  gap: 7px;
  font-size: 13px;
  font-weight: 600;
}
.reminders select,
.workticket input,
.draftfields textarea {
  border: 1px solid #bacbc3;
  border-radius: 8px;
  background: #fff;
  padding: 7px 9px;
  color: var(--ink);
  font-size: 14px;
}
.reminders small {
  width: 100%;
}
.worktabs {
  display: flex;
  padding: 4px;
  gap: 4px;
  border-radius: 12px;
  overflow-x: auto;
}
.worktabs button {
  flex: 1;
  min-width: 84px;
  border-radius: 8px;
  background: none;
  border: 0;
  padding: 8px;
  color: var(--muted);
}
.worktabs button.active {
  background: #dfeee3;
  color: var(--deep);
}
.source {
  margin: 12px 0;
  padding: 10px 12px;
  background: #f5f7f4;
  border-radius: 9px;
  font-size: 13px;
}
.source summary {
  cursor: pointer;
  font-weight: 600;
}
.source ul {
  margin: 7px 0 0;
  padding-left: 18px;
}
.draftfields {
  display: grid;
  gap: 8px;
}
.draftfields textarea {
  width: 100%;
  resize: vertical;
  min-height: 50px;
}
.checkrow {
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  margin: 13px 0;
}
.checkrow input {
  margin-top: 4px;
  accent-color: var(--teal);
  width: 17px;
  height: 17px;
}
.workticket {
  border-top: 1px solid var(--line);
  padding-top: 11px;
  margin-top: 13px;
}
.workticket form {
  margin: 7px 0;
}
.workticket input {
  width: 100%;
  margin-bottom: 7px;
}
.count {
  padding: 2px 8px;
  background: var(--mint);
  border-radius: 8px;
  font-size: 12px;
}
.pad table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin: 12px 0;
}
.tablewrap {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
}
.registrationtable {
  min-width: 560px;
}
.patientlink {
  border: 0;
  background: none;
  padding: 2px 0;
  color: var(--teal);
  font-weight: 700;
  text-align: left;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.patientlink:hover {
  color: var(--deep);
}
.emptyqueue {
  margin-top: 14px !important;
  padding: 18px;
  border-radius: 11px;
  background: #f5f8f3;
  text-align: center;
}
.modalbackdrop {
  position: fixed;
  z-index: 60;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 20px;
  background: #102b2a99;
  backdrop-filter: blur(3px);
}
.registrationmodal {
  width: min(680px, 100%);
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: white;
  box-shadow: 0 24px 70px #102b2a40;
}
.modalhead {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}
.registrationmodal h2 {
  margin-top: 3px;
  font-size: 24px;
}
.modalactions {
  justify-content: flex-end;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.insuranceverified {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin: 14px 0;
  padding: 13px 14px;
  border: 1px solid #b9d5bd;
  border-radius: 11px;
  background: #edf7ed;
  color: #195e38;
}
.insuranceverified > div {
  display: flex;
  align-items: center;
  gap: 9px;
}
.insuranceverified b,
.insuranceverified small {
  display: block;
}
.insuranceverified small {
  color: #4c6265;
  margin-top: 2px;
}
.queueoverview {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.queueoverview > div {
  display: grid;
  gap: 4px;
  padding: 15px 17px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: white;
}
.queueoverview small {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.queueoverview strong {
  color: var(--deep);
  font-size: 28px;
  line-height: 1;
}
.queueoverview strong span {
  font-size: 13px;
}
.queuesafety p {
  color: inherit;
}
.flowtable {
  min-width: 720px;
}
.flowtable td:first-child {
  text-align: center;
}
.flowtable td:nth-child(2) b,
.flowtable td:nth-child(2) small {
  display: block;
}
.flowtable td:nth-child(2) small {
  margin-top: 2px;
}
.flowtable tr.urgentrow td {
  background: #fff8ef;
}
.queueposition {
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--mint);
  color: var(--teal);
}
.prioritypill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  font-size: 11px;
  font-weight: 700;
}
.prioritypill i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #7b918a;
}
.prioritypill.urgent {
  color: #8d2f22;
}
.prioritypill.urgent i {
  background: #c84432;
  box-shadow: 0 0 0 3px #f4d8d3;
}
.prioritypill.high {
  color: #91530c;
}
.prioritypill.high i {
  background: #d6801d;
}
.prioritypill.moderate i {
  background: #d2a329;
}
.prioritypill.standard i {
  background: #4d8b69;
}
.pad caption {
  text-align: left;
  font-weight: 600;
  margin: 4px 0 6px;
}
.pad td,
.pad th {
  text-align: left;
  padding: 7px 8px;
  border-bottom: 1px solid var(--line);
}
.pad th {
  background: #edf4ef;
}
.footer button {
  color: var(--muted);
  font-size: 12px;
}
.sr-only,
.skip:not(:focus) {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
.skip:focus {
  position: absolute;
  z-index: 20;
  background: white;
  padding: 8px;
}
.status {
  color: var(--deep);
  margin-top: 8px;
}
.inline-action {
  display: inline-block;
}
.small {
  font-size: 12px !important;
}
.rating {
  margin-top: 16px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
  font-size: 12px;
  color: var(--muted);
}
.rating span,
.rating > div,
.rating button {
  display: flex;
  align-items: center;
  gap: 5px;
}
.rating > div {
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.rating button {
  border: 1px solid var(--line);
  background: white;
  border-radius: 7px;
  padding: 4px 8px;
  font-size: 12px;
}
.rating button.selected {
  background: var(--mint);
  color: var(--teal);
  border-color: var(--teal);
}
.reminder-preview {
  width: 100%;
  font-size: 13px !important;
  color: var(--ink) !important;
  background: #f3f6ee;
  padding: 8px 10px;
  border-radius: 8px;
}
@media (max-width: 840px) {
  .wrap {
    width: calc(100% - 32px);
  }
  .layout {
    grid-template-columns: minmax(0, 1.75fr) minmax(210px, 1fr);
    gap: 13px;
  }
  .pad,
  .ask,
  .visit,
  .sidequeue {
    padding: 17px;
  }
  .quickgrid {
    grid-template-columns: 1fr;
  }
  .quickgrid button {
    min-height: 41px;
  }
  .hero {
    min-height: 137px;
    padding: 23px;
  }
  .tabs {
    gap: 16px;
  }
}
@media (max-width: 670px) {
  .wrap {
    width: calc(100% - 24px);
  }
  .top {
    min-height: 62px;
  }
  .mastactions {
    gap: 5px;
  }
  .language,
  .team-button {
    padding: 0 6px;
    font-size: 12px;
    min-height: 37px;
  }
  .mark {
    width: 35px;
    height: 35px;
  }
  .brand {
    gap: 6px;
  }
  .brand strong {
    font-size: 18px;
  }
  .brand span {
    font-size: 9.5px;
  }
  .tabs {
    gap: 2px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    min-height: 42px;
  }
  .hospitaltabs {
    min-height: 48px;
  }
  .hospitaltabs a,
  .hospitaltabs button {
    min-width: 96px;
    padding: 10px 8px;
    font-size: 11.5px;
  }
  .formgrid,
  .summarygrid {
    grid-template-columns: 1fr;
  }
  .scanbox {
    grid-template-columns: auto 1fr;
  }
  .scanbox .filebutton,
  .scanbox > button,
  .scanbox > .wide {
    grid-column: 1 / -1;
  }
  .waitoverview {
    grid-template-columns: 1fr;
  }
  .estimate {
    border-right: 0;
    border-bottom: 1px solid #cbdcca;
    padding: 0 0 12px;
  }
  .statussteps {
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .statussteps li {
    grid-template-columns: 28px 1fr;
    justify-items: start;
    align-items: center;
    text-align: left;
  }
  .statussteps li:before {
    top: -9px;
    left: 13px;
    height: 17px;
    width: 0;
    border-top: 0;
    border-left: 2px solid var(--line);
  }
  .insuranceverified {
    align-items: stretch;
    flex-direction: column;
  }
  .queueoverview {
    grid-template-columns: 1fr;
  }
  .tabs button {
    white-space: normal;
    justify-content: center;
    font-size: 11.5px;
    gap: 4px;
    line-height: 1.15;
    height: 48px;
    padding: 4px;
  }
  .tabs button svg {
    width: 14px;
  }
  .main {
    padding-top: 12px;
  }
  .hero {
    border-radius: 15px;
    min-height: 124px;
    padding: 17px;
  }
  .hero h1 {
    font-size: 28px;
    letter-spacing: -1.1px;
  }
  .hero p {
    font-size: 12.5px;
  }
  .hero .eyebrow {
    font-size: 9px;
  }
  .hero-art {
    width: 27%;
  }
  .stamp {
    width: 47px;
    height: 47px;
    border-radius: 13px;
  }
  .stamp svg {
    width: 28px;
  }
  .o1 {
    width: 65px;
    height: 65px;
  }
  .o2 {
    width: 103px;
    height: 103px;
  }
  .o3 {
    width: 139px;
    height: 139px;
  }
  .dot {
    display: none;
  }
  .layout {
    grid-template-columns: 1fr;
    margin-top: 12px;
  }
  .column,
  .rail {
    gap: 10px;
  }
  .quickgrid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
  }
  .quickgrid button {
    font-size: 12px;
    padding: 8px;
    gap: 5px;
  }
  .quickgrid button svg:last-child {
    display: none;
  }
  .card h2 {
    font-size: 19px;
  }
  .pad,
  .ask {
    padding: 15px;
  }
  .footer {
    margin-top: 12px;
    align-items: flex-start;
  }
  .slotgrid {
    gap: 5px;
  }
  .reminders select {
    max-width: 100%;
  }
  .emergency {
    order: -1;
  }
  .sidequeue .textbtn {
    min-height: 36px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }
}
@media print {
  .mast,
  .navwrap,
  .hero,
  .rail,
  .footer,
  .nextcard,
  .skip,
  .worktabs,
  .actions,
  .reminders,
  .light,
  .primary,
  .card:not(.printable),
  .verified svg {
    display: none !important;
  }
  .wrap {
    width: 100%;
  }
  .layout,
  .column,
  .printable {
    display: block !important;
  }
  .printable {
    box-shadow: none;
    border: 0;
  }
  .main {
    padding: 0;
  }
  body {
    background: white;
  }
  .booking {
    border: 1px solid #333;
  }
}
